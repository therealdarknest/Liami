<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <title>liami.AI</title>

    <link rel="stylesheet" href="Untitled-2.css">

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="Untitled-3.js"></script>
</head>

<body>

    <!-- BARRA AZIONI -->
    <div class="floating-action-bar">
        <button
            id="auth-btn"
            class="floating-btn"
            type="button"
            onclick="openAuthModal()">
            Accedi / Registrati
        </button>

        <button
            class="floating-btn primary"
            type="button"
            onclick="openUploadModal()">
            + Carica Video
        </button>
    </div>


    <!-- ACCESSO E REGISTRAZIONE -->
    <div id="auth-modal" class="modal-overlay" aria-hidden="true">

        <div
            class="modal-window"
            role="dialog"
            aria-modal="true"
            aria-labelledby="auth-modal-title">

            <div class="modal-header">

                <div>
                    <h2 id="auth-modal-title" class="visually-hidden">
                        Account Liami
                    </h2>

                    <div class="auth-tabs">

                        <button
                            id="tab-login"
                            class="tab-btn active"
                            type="button"
                            onclick="switchAuthTab('login')">
                            Accedi
                        </button>

                        <button
                            id="tab-register"
                            class="tab-btn"
                            type="button"
                            onclick="switchAuthTab('register')">
                            Registrati
                        </button>
                        placeholder="Chiedimi qualcosa..."
                        enterkeyhint="send"
                        autocomplete="off"
                        rows="1">
                    </textarea>

                    <div class="input-actions">

                        <span class="input-hint">
                            Liami.AI
                        </span>

                        <button
                            id="send-button"
                            type="button"
                            aria-label="Invia messaggio">
                            ↑
                        </button>

                    </div>

                </div>


                <div class="suggestions">

                    <button class="suggestion" type="button">
                        ✧ Ristrutturare casa
                    </button>

                    <button class="suggestion" type="button">
                        ◇ Ristoranti vicini a me
                    </button>

                    <button class="suggestion" type="button">
                        ⌕ Libri di fantascienza
                    </button>

                </div>

            </section>


            <section
                id="chat-area"
                class="chat-area"
                aria-live="polite">
            </section>


            <footer>
                Liami.AI · Your personal intelligence
            </footer>

        </div>

    </main>



    <!-- FEED VIDEO -->

<!-- FEED VIDEO -->
<section
    class="liami-feed"
    id="liami-feed"
    hidden
    aria-label="Video delle attività">

    <div class="feed-heading">
        <div>
            <span class="feed-eyebrow">RISULTATI LIAMI</span>
            <h2 id="feed-query-title">Attività per la tua ricerca</h2>
        </div>
        <span class="feed-heading-mark" aria-hidden="true">✦</span>
    </div>

    <div class="feed-layout">
        <div
            class="feed-container"
            id="feed-container">
        </div>

        <aside
            id="business-results"
            class="business-results"
            aria-label="Aziende pertinenti alla ricerca"
            aria-live="polite">
        </aside>
    </div>

</section>




    <!-- PULSANTE MAPPA -->
    <button
        id="open-map-button"
        class="open-map-button"
        type="button">
        ⌖ Apri mappa
    </button>



    <!-- MAPPA GOOGLE -->
    <div
        id="map-overlay"
        class="map-overlay"
        aria-hidden="true">

        <div
            class="map-window"
            role="dialog"
            aria-modal="true"
            aria-labelledby="map-title">

            <div class="map-window-header">

                <div>
                    <h2 id="map-title">
                        Esplora la mappa
                    </h2>

                    <span>
                        Google Maps · Liami.AI
                    </span>
                </div>

                <button
                    id="close-map"
                    type="button"
                    aria-label="Chiudi mappa">
                    ✕
                </button>

            </div>


            <iframe
                title="Mappa dei risultati Liami"
                src="https://maps.google.com/maps?q=Italia&z=5&output=embed"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen>
            </iframe>

        </div>

    </div>

</body>
</html>
